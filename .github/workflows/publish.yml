name: Publish Fabric and NeoForge mods

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          title = os.environ.get('RELEASE_NAME') or os.environ['RELEASE_TAG']
          title = re.sub(r'^v?\d[^:]*:\s*', '', title).strip()
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.+_-]*', version):
              raise ValueError('Invalid release version')
          title = title.replace('\r', ' ').replace('\n', ' ')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'VERSION={version}\nRELEASE_TITLE={title}\n')
          PY

      - name: Build mod
        env:
          LOADER: ${{ matrix.loader }}
        run: |
          chmod +x gradlew
          ./gradlew ":${LOADER}:build" "-Prelease_version=${VERSION}" --no-daemon

      - name: Save built mod
        uses: actions/upload-artifact@v4
        with:
          name: cobblemon-rlm-${{ matrix.loader }}-${{ env.VERSION }}
          path: ${{ matrix.loader }}/build/libs/cobblemon-rlm-${{ matrix.loader }}-${{ env.VERSION }}.jar
          if-no-files-found: error

      - name: Publish mod to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: GC58bFHM
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1449941
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: '${{ matrix.loader }}/build/libs/cobblemon-rlm-${{ matrix.loader }}-${{ env.VERSION }}.jar'
          name: '${{ env.RELEASE_TITLE }} (${{ matrix.loader }})'
          version: '${{ env.VERSION }}-${{ matrix.loader }}'
          game-versions: 1.21.1
          game-version-filter: any
          changelog: ${{ github.event.release.body }}
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          loaders: ${{ matrix.loader }}
          dependencies: |
            MdwFAVRL(required)
            SszvX85I(optional)
            ${{ matrix.loader == 'fabric' && 'P7dR8mSH(required)' || '' }}
          curseforge-dependencies: |
            687131(required)
            1189523(optional)
            ${{ matrix.loader == 'fabric' && '306612(required)' || '' }}

  notify-discord:
    needs: publish
    uses: ./.github/workflows/discord-release.yml
    with:
      logo-path: cobblemon_rlm_pack.png
      release-details: |
        Minecraft **1.21.1** · Cobblemon **1.8.2**
        **Fabric** / **NeoForge** · Un **JAR** par chargeur
        Mega Showdown optionnel
      download-links: |
        [Modrinth](https://modrinth.com/project/cobblemon-rlm)
        [CurseForge](https://www.curseforge.com/minecraft/mc-addons/cobblemon-rlm)
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
