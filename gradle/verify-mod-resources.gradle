import groovy.json.JsonSlurper
import java.util.zip.ZipFile

tasks.register('verifyModResources') {
    group = 'verification'
    description = 'Checks installable JARs, item assets, optional recipes and regional form features.'
    dependsOn 'collectMods'
    inputs.dir rootProject.file('common/src/main/resources')
    inputs.file rootProject.file('common/src/main/java/fr/antredesloutres/cobblemonrlm/item/MegaGem.java')

    doLast {
        def resources = rootProject.file('common/src/main/resources')
        def json = new JsonSlurper()
        // Cobblemon 1.8 follows model locators; the old calculated seat offsets are unused.
        fileTree(new File(resources, 'data/cobblemon/species')).matching { include '**/*.json' }.each { speciesFile ->
            def species = json.parse(speciesFile, 'UTF-8')
            if (!species.riding) return
            def seats = species.riding.seats
            if (!seats || seats.any { !it.locator || it.containsKey('offset') || it.containsKey('poseOffsets') }) {
                throw new GradleException("${speciesFile.name} must use explicit Cobblemon 1.8 seat locators.")
            }
            def speciesId = "cobblemon:${speciesFile.name - '.json'}"
            def models = fileTree(new File(resources, 'assets/cobblemon/bedrock/pokemon/resolvers'))
                .matching { include '**/*.json' }.collect { json.parse(it, 'UTF-8') }
                .findAll { it.species == speciesId }.collectMany { it.variations }
                .findAll { it.model }.collect { it.model }.toSet()
            if (!models) throw new GradleException("No riding models found for ${speciesId}")
            models.each { modelId ->
                def (namespace, modelName) = modelId.split(':', 2)
                def files = fileTree(new File(resources, "assets/${namespace}/bedrock/pokemon/models"))
                    .matching { include "**/${modelName}.json" }.files
                if (files.size() != 1) throw new GradleException("Cannot resolve riding model ${modelId}")
                def geometry = json.parse(files.first(), 'UTF-8')['minecraft:geometry']
                def locators = geometry.collectMany { it.bones }.collectMany { (it.locators ?: [:]).keySet() }.toSet()
                if (!locators.containsAll(seats.collect { it.locator })) {
                    throw new GradleException("${modelId} is missing a seat locator for ${speciesId}")
                }
            }
        }
        // Species additions can replace each other's feature lists, including Mega Showdown's additions.
        ['mawile', 'delphox'].each { species ->
            def forms = json.parse(new File(resources, "data/cobblemon/species_additions/${species}.json"), 'UTF-8').forms
            def requiredAspects = forms.collectMany { it.aspects }.toSet()
            def assignment = json.parse(new File(resources, "data/rlm_megas/species_feature_assignments/${species}_rlm.json"), 'UTF-8')
            def assignedAspects = assignment.features.collectMany { feature ->
                def provider = json.parse(new File(resources, "data/cobblemon/species_features/${feature}.json"), 'UTF-8')
                provider.isAspect ? provider.keys : []
            }.toSet()
            if (!assignment.pokemon.contains(species) || !assignedAspects.containsAll(requiredAspects)) {
                throw new GradleException("${species} regional forms are missing assigned species features.")
            }
        }
        def recipes = fileTree(new File(resources, 'data/rlm_megas/recipe')).matching { include '*.json' }
        def itemIds = recipes.collect { json.parse(it, 'UTF-8').result.id }.toSet()
        def gems = json.parse(new File(resources, 'data/rlm_megas/tags/item/mega_gems.json'), 'UTF-8').values.toSet()
        // Cobblemon generates Showdown names as species + '-' + the declared form name.
        // Mega Showdown looks up megaStone by the current species.name, then changes to its value.
        def megaForms = [
            ampharositerlm: ['Ampharos', 'rlm', 'ampharos_rlm_mega'],
            flammikite: ['Flammiko', null, 'flammiko_mega'],
            mawiliterlmdragon: ['Mawile', 'dragon', 'mawile_rlm_dragon_mega'],
            mawiliterlmpoison: ['Mawile', 'poison', 'mawile_rlm_poison_mega'],
            wamekite: ['Wamek', null, 'wamek_mega']
        ]
        megaForms.each { stone, definition ->
            def addition = json.parse(new File(resources, "data/rlm_megas/species_additions/${definition[2]}.json"), 'UTF-8')
            def base = definition[0] + (definition[1] ? "-${definition[1]}" : '')
            def target = "${definition[0]}-${addition.forms[0].name}"
            def script = new File(resources, "data/rlm_megas/mega_showdown/showdown/held_items/${stone}.js").getText('UTF-8')
            if (!script.contains("\"${base}\": \"${target}\"")) {
                throw new GradleException("${stone} must map ${base} to the declared Mega form ${target}")
            }
        }
        if (itemIds != gems || itemIds.isEmpty()) {
            throw new GradleException('Mega Gem recipes and item tag disagree.')
        }
        def gemSource = rootProject.file('common/src/main/java/fr/antredesloutres/cobblemonrlm/item/MegaGem.java').getText('UTF-8')
        itemIds.each { id ->
            def path = id.split(':', 2)[1]
            if (!gemSource.contains("(\"${path}\")")) {
                throw new GradleException("No shared item registration for ${id}")
            }
            def model = json.parse(new File(resources, "assets/rlm_megas/models/item/${path}.json"), 'UTF-8')
            def namespaceAndPath = model.textures.layer0.split(':', 2)
            if (!new File(resources, "assets/${namespaceAndPath[0]}/textures/${namespaceAndPath[1]}.png").isFile()) {
                throw new GradleException("Missing texture for ${id}")
            }
            ['fr_fr', 'en_us'].each { locale ->
                def lang = json.parse(new File(resources, "assets/rlm_megas/lang/${locale}.json"), 'UTF-8')
                if (!lang["item.rlm_megas.${path}"] || !lang["item.rlm_megas.${path}.description"]) {
                    throw new GradleException("Missing ${locale} translation for ${id}")
                }
            }
        }

        ['fabric', 'neoforge'].each { loader ->
            def jarFile = layout.buildDirectory.file("libs/cobblemon-rlm-${loader}-${project.version}.jar").get().asFile
            new ZipFile(jarFile).withCloseable { jar ->
                def metadataPath = loader == 'fabric' ? 'fabric.mod.json' : 'META-INF/neoforge.mods.toml'
                if (!jar.getEntry(metadataPath) || !jar.getEntry("fr/antredesloutres/cobblemonrlm/${loader}/CobblemonRlm${loader == 'fabric' ? 'Fabric' : 'NeoForge'}.class")) {
                    throw new GradleException("Missing ${loader} metadata or entrypoint")
                }
                def otherMetadata = loader == 'fabric' ? 'META-INF/neoforge.mods.toml' : 'fabric.mod.json'
                if (jar.getEntry(otherMetadata) || jar.getEntry('META-INF/mods.toml')) {
                    throw new GradleException("Wrong loader metadata in ${jarFile.name}")
                }
                fileTree(resources).files.each { original ->
                    def path = resources.toPath().relativize(original.toPath()).toString().replace('\\', '/')
                    def entry = jar.getEntry(path)
                    if (!entry) {
                        throw new GradleException("Missing resource in ${jarFile.name}: ${path}")
                    }
                    byte[] packaged = jar.getInputStream(entry).withCloseable { it.readAllBytes() }
                    if (path.startsWith('data/rlm_megas/recipe/')) {
                        def recipe = json.parseText(new String(packaged, 'UTF-8'))
                        def sourceRecipe = json.parse(original, 'UTF-8')
                        def condition = loader == 'fabric' ? recipe.remove('fabric:load_conditions') : recipe.remove('neoforge:conditions')
                        def expected = loader == 'fabric' ? [[condition: 'fabric:all_mods_loaded', values: ['mega_showdown']]] : [[type: 'neoforge:mod_loaded', modid: 'mega_showdown']]
                        if (condition != expected || recipe != sourceRecipe || !itemIds.contains(recipe.result.id)) {
                            throw new GradleException("Invalid optional item recipe: ${loader}/${path}")
                        }
                    } else if (!Arrays.equals(original.bytes, packaged)) {
                        throw new GradleException("Resource changed while packaging ${jarFile.name}: ${path}")
                    }
                }
            }
            logger.lifecycle("Verified ${jarFile.name}: ${itemIds.size()} registered item recipes and all common resources.")
        }
    }
}

tasks.named('check') { dependsOn 'verifyModResources' }
